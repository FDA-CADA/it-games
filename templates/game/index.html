<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO: tên game (2–4 từ) -->
  <title>Game Title</title>
  <link rel="icon" href="../../../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- lang.js phải nạp trong <head> để chọn ngôn ngữ trước khi trang hiển thị -->
  <script src="../../../../assets/js/lang.js"></script>
  <link rel="stylesheet" href="../../../../assets/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- data-root: đường dẫn về gốc site (topics/<chủ đề>/<phần>/<game>/ → 4 cấp)
     data-game: phải trùng với id trong assets/js/catalog.js -->
<body data-root="../../../../" data-game="game-id">
  <header data-shell></header>

  <main class="container game-main">
    <!-- Màn hình 1: giới thiệu + chọn level -->
    <section data-screen="start" class="card">
      <h1>🎮 Game Title</h1>
      <!-- Đoạn dài: một khối cho mỗi ngôn ngữ -->
      <p data-lang="vi">Một đoạn ngắn: game luyện kỹ năng gì, luật chơi cốt lõi.</p>
      <p data-lang="en">A short paragraph: what skill the game trains and the core rule.</p>
      <!-- Câu ngắn: bản tiếng Anh đặt trong data-en -->
      <p class="muted" data-en="A tip or a teaser question.">Mẹo hoặc câu hỏi gợi mở.</p>
      <div class="level-list" id="levels"></div>
    </section>

    <!-- Màn hình 2: chơi -->
    <section data-screen="play" hidden>
      <div class="hud">
        <span class="stat">Level<b id="hud-level">1</b></span>
        <span class="stat"><span data-en="Round">Vòng</span><b id="hud-round">1/5</b></span>
        <span class="stat"><span data-en="Score">Điểm</span><b id="hud-score">0</b></span>
      </div>
      <div class="card">
        <div id="stage"><!-- TODO: khu vực chơi --></div>
        <div class="feedback" id="feedback"></div>
        <div class="row" style="margin-top:14px;justify-content:flex-end">
          <button class="btn" id="btn-next" hidden data-en="Next round →">Vòng tiếp →</button>
        </div>
      </div>
    </section>

    <!-- Màn hình 3: kết thúc -->
    <section data-screen="end" class="card center" hidden>
      <h2 id="end-title" data-en="Done!">Hoàn thành!</h2>
      <div class="end-score" id="end-score">0</div>
      <p class="muted" id="end-detail"></p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="btn-again" data-en="Replay this level">Chơi lại level này</button>
        <button class="btn ghost" id="btn-menu" data-en="Choose another level">Chọn level khác</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:12px" id="next-game"></div>
    </section>
  </main>

  <!-- Hộp thoại hướng dẫn: nút "?" trên header tự mở hộp này -->
  <dialog class="help">
    <h2 data-en="How to play">Cách chơi</h2>
    <ul data-lang="vi">
      <li>Bước 1…</li>
      <li>Cách tính điểm…</li>
    </ul>
    <ul data-lang="en">
      <li>Step 1…</li>
      <li>Scoring…</li>
    </ul>
    <button class="btn" data-close data-en="Got it">Đã hiểu</button>
  </dialog>

  <script src="../../../../assets/js/catalog.js"></script>
  <script src="../../../../assets/js/common.js"></script>
  <script src="game.js"></script>
</body>
</html>
