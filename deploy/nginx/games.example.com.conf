# Site tĩnh. Chép vào /etc/nginx/sites-available/, đổi domain, rồi:
#   sudo ln -s /etc/nginx/sites-available/games.example.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d games.example.com -d api.example.com   # Certbot tự thêm HTTPS + chuyển hướng
server {
    listen 80;
    server_name games.example.com;

    root /srv/it-games;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / { try_files $uri $uri/ =404; }
    # config.js đổi khi bạn sửa cấu hình: đừng để trình duyệt cache lâu
    location = /assets/js/config.js { add_header Cache-Control "no-cache"; }
    location ~ ^/(deploy|docs|tools|templates|\.git) { return 404; }
}
